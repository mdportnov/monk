name: mobile-ci

on:
  push:
    branches: [master]
    paths: ["mobile/**", ".github/workflows/mobile-ci.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile-ci.yml"]

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # `packages: ''` skips the action's default `tools platform-tools` install: Google removed
      # the obsolete `tools` package from the SDK repository, so sdkmanager now exits 1 on it and
      # the step dies. The runner image already ships the SDK, and Gradle fetches what it needs.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
      - name: build + test
        run: ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: monk-android-debug
          path: mobile/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7
