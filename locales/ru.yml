  preset_lockdown_label: "Lockdown"
  preset_lockdown_blurb: "Почти всё выключено, кроме чата. Режим под горящий дедлайн, из которого так просто не выйдешь."
  preset_no_social_label: "No Social"
  preset_no_social_blurb: "FB, IG, X, TikTok, Reddit, Threads, ВК, ОК и остальные. Только соцсети."
  preset_no_video_label: "No Video"
  preset_no_video_blurb: "Анти-бинж: YouTube, Netflix, Twitch, Disney+ и стриминги. RU-стриминги тоже."
  preset_no_news_label: "No News"
  preset_no_news_blurb: "Режет петлю думскролла: BBC, CNN, NYT, Лента, РБК, Медуза и компания."
  preset_no_games_label: "No Games"
  preset_no_games_blurb: "Steam, Epic, Battle.net, консольные магазины, браузерки и игровая пресса."
  preset_no_chat_label: "No Chat"
  preset_no_chat_blurb: "Slack, Discord, Telegram, WhatsApp, Teams, Messenger. Под короткие спринты письма/кода."
  preset_no_shopping_label: "No Shopping"
  preset_no_shopping_blurb: "Против импульсных покупок: Amazon, AliExpress, WB, Ozon, Avito, Temu и другие."
  preset_no_adult_label: "No Adult"
  preset_no_adult_blurb: "Взрослый контент. Длинная минимальная длительность и не больше одного раннего выхода за два часа, чтобы ритуал держался."
  preset_no_gambling_label: "No Gambling"
  preset_no_gambling_blurb: "Ставки, криптобиржи и финансовый думскролл — одна аддиктивная петля."
